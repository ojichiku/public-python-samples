; Default logging configuration shared across Python samples.
[loggers]
keys=root

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=defaultFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=defaultFormatter
args=('logs/app.log', 'a')

[formatter_defaultFormatter]
format=%(asctime)s.%(msecs)03d [%(levelname)s] %(message)s
datefmt=%Y/%m/%d %H:%M:%S
