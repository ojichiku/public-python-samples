; 共有 Python サンプル向けの標準ログ設定。
[loggers]
; 利用するロガーを列挙。root ロガーのみ使用。
keys=root

[handlers]
; 標準出力とファイルの 2 系統を定義。
keys=consoleHandler,fileHandler

[formatters]
; 共通フォーマッタを 1 種類だけ提供。
keys=defaultFormatter

[logger_root]
; ルートロガーは INFO レベルで 2 つのハンドラを利用。
level=INFO
handlers=consoleHandler,fileHandler

[handler_consoleHandler]
; 標準出力へ出すハンドラ。
class=StreamHandler
level=INFO
formatter=defaultFormatter
args=(sys.stdout,)

[handler_fileHandler]
; ファイルへ追記するハンドラ。
class=FileHandler
level=INFO
formatter=defaultFormatter
args=('logs/app.log', 'a')

[formatter_defaultFormatter]
; 日付とレベルを含むフォーマットの定義。
format=%(asctime)s.%(msecs)03d [%(levelname)s] %(message)s
datefmt=%Y/%m/%d %H:%M:%S
