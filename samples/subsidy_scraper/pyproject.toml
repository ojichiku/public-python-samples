[project]
name = "subsidy-scraper"
version = "0.1.0"
description = "中小企業庁の2026年度補助金公募情報を取得するCLIサンプル"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "requests>=2.32,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subsidy_scraper"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "--cov=subsidy_scraper --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
# リポジトリのpre-commit Ruff v0.6.1が対応する上限。実行Pythonは3.14系。
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
